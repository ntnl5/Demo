<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | {{business.name}}{{#if meta.noindex}} (design preview){{/if}}</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="{{brand.colors.slate900}}" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='{{brand.colors.accentEnc}}'/%3E%3Cpath d='M8 22 L20 11 L32 22' fill='none' stroke='{{brand.colors.logoMarkInkEnc}}' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M11 22 V30 H29 V22' fill='none' stroke='{{brand.colors.logoMarkInkEnc}}' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M17 30 V25 H23 V30' fill='none' stroke='{{brand.colors.logoMarkInkEnc}}' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{ --slate-900:{{brand.colors.slate900}}; --slate-700:{{brand.colors.slate700}}; --paper:{{brand.colors.paper}};
         --slate-500:{{brand.colors.slate500}}; --copper:{{brand.colors.accent}}; --copper-bright:{{brand.colors.accentBright}}; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--slate-900);color:var(--paper);text-align:center;padding:32px 22px 64px;
    font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
  .wrap{max-width:520px;}
  .mark{width:56px;height:56px;margin:0 auto 26px;display:block;}
  .code{font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--copper-bright);margin:0 0 12px;}
  h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;margin:0 0 14px;letter-spacing:-.02em;}
  p{color:var(--slate-500);line-height:1.65;margin:0 0 28px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--copper);color:{{brand.colors.logoMarkInk}};
    text-decoration:none;font-weight:700;padding:13px 26px;border-radius:999px;
    transition:background .25s ease,transform .25s ease;}
  .btn:hover{background:var(--copper-bright);transform:translateY(-2px);}
  .btn:focus-visible{outline:3px solid var(--copper-bright);outline-offset:3px;}
  .ribbon{position:fixed;bottom:0;left:0;right:0;
    background:rgba(21,25,32,.94);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:#b9c0cb;border-top:1px solid rgba(226,145,58,.42);
    font-size:.76rem;font-weight:600;padding:8px 14px;line-height:1.35;
    box-shadow:0 -2px 18px rgba(0,0,0,.22);}
  .ribbon b{color:var(--copper-bright);font-weight:800;}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="10" fill="{{brand.colors.accent}}"/>
      <path d="M8 22 L20 11 L32 22" stroke="{{brand.colors.logoMarkInk}}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M11 22 V30 H29 V22" stroke="{{brand.colors.logoMarkInk}}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M17 30 V25 H23 V30" stroke="{{brand.colors.logoMarkInk}}" stroke-width="2.6" stroke-linejoin="round"/>
    </svg>
    <p class="code">Error 404</p>
    <h1>That page isn't here</h1>
    <p>The link may be out of date, or the page may have moved. Everything on this build lives on the one page.</p>
    <a class="btn" href="/">Back to the homepage</a>
  </div>
{{#if meta.noindex}}  <div class="ribbon" role="note">
    <b>Design preview</b>: sample business, not a real company.
  </div>{{/if}}
</body>
</html>
